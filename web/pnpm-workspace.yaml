packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
overrides:
  # Security patches for GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx.
  "browserslist@<=4.28.6": 4.28.7
auditConfig:
  # FAR/AIM Pro is a static SPA and does not use React Router RSC APIs.
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
