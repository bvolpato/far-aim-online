packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
overrides:
  # Security patches for GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx.
  "browserslist@<=4.28.6": 4.28.7
auditConfig:
  # FAR/AIM Pro is a static SPA and does not use React Router RSC APIs.
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
minimumReleaseAgeExclude:
  # Security patch for GHSA-2v37-7h3g-55p8; remove after it clears age gate.
  - nanoid@3.3.18
  # Security patch for GHSA-698v-4r3x-3vcv.
  - vite@8.1.6
  # Security patches for GHSA-qxg6-89mg-rqv8 and GHSA-xp26-3454-mjgp.
  - "vitest@4.1.12"
  - "@vitest/spy@4.1.12"
  - "@vitest/utils@4.1.12"
  - "@vitest/expect@4.1.12"
  - "@vitest/mocker@4.1.12"
  - "@vitest/runner@4.1.12"
  - "@vitest/snapshot@4.1.12"
  - "@vitest/pretty-format@4.1.12"
