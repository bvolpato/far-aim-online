name: Web CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Web build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test deployment tooling
        working-directory: ${{ github.workspace }}
        run: node --test scripts/tests/*.test.mjs

      - name: Verify generated search indexes
        working-directory: ${{ github.workspace }}
        run: node scripts/build_inverted_index.js --check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Package tested release
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/web-release.mjs stamp "$RELEASE_SHA"
          tar -C web/dist -czf "$RUNNER_TEMP/web-dist.tar.gz" .

      - name: Upload tested release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production website
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: faraim-web-production
      cancel-in-progress: false
    steps:
      - name: Skip superseded releases
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            const current = data.object.sha === context.sha;
            core.setOutput('deploy', String(current));
            if (!current) {
              await core.summary.addRaw(`Skipped superseded release ${context.sha}.`).write();
            }

      - name: Check out release source
        if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download tested release
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-release

      - name: Validate tested release
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p web/dist
          tar -xzf "$RUNNER_TEMP/web-release/web-dist.tar.gz" -C web/dist
          node scripts/web-release.mjs validate "$RELEASE_SHA"

      - name: Authenticate to Google Cloud
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish website
        if: steps.current.outputs.deploy == 'true'
        run: ./deploy.sh --skip-tests --skip-build

      - name: Verify live release
        if: steps.current.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/web-release.mjs verify "$RELEASE_SHA"
          printf 'Deployed and verified [%s](https://github.com/%s/commit/%s) at https://faraim.online.\n' \
            "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
