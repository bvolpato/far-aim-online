name: Official Aviation Reference Refresh PR

run-name: Official reference refresh (${{ github.event_name }})

on:
  schedule:
    - cron: '31 14 * * *'
    - cron: '31 15 * * 6'
    - cron: '47 15 1 * *'
  workflow_dispatch:
    inputs:
      refresh_reference_sources:
        description: Refresh FAR, AIM, and PCG as well as the AC catalog
        type: boolean
        default: true

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: official-content-refresh
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/official-content-refresh
  WORKFLOW_FILE: .github/workflows/ac-content-update-pr.yml
  PDF_URL_AUDIT_SCHEDULE: '47 15 1 * *'
  FAR_AIM_REFRESH_SCHEDULE: '31 15 * * 6'
  PYTHONUNBUFFERED: '1'

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Sync Python dependencies
        working-directory: scripts
        run: uv sync --frozen --python 3.12 --extra ocr

      - name: Snapshot current AC index
        run: cp data/advisory-circulars/index.json "$RUNNER_TEMP/ac-index-before.json"

      - name: Fetch current FAA AC catalog
        working-directory: scripts
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          args=(
            --strict
            --catalog-attempts 4
            --catalog-timeout 120
            --changed-ids-file "$RUNNER_TEMP/ac-changed-ids.txt"
            --max-workers 4
          )
          if [[ "$SCHEDULE" != "$PDF_URL_AUDIT_SCHEDULE" ]]; then
            args+=(--skip-pdf-fetch)
          else
            args+=(--audit-pdf-content)
          fi
          uv run python update_advisory_circulars.py "${args[@]}"

      - name: Refresh FAR, AIM, and PCG sources
        if: github.event.schedule == env.FAR_AIM_REFRESH_SCHEDULE || (github.event_name == 'workflow_dispatch' && inputs.refresh_reference_sources)
        working-directory: scripts
        shell: bash
        run: |
          set -o pipefail
          uv run python crawl_far.py 2>&1 | tee "$RUNNER_TEMP/far-refresh.log"
          grep -Eq 'Failed parts: 0$' "$RUNNER_TEMP/far-refresh.log"
          uv run python crawl_aim.py
          uv run python crawl_pcg.py

      - name: Update FAR, AIM, and PCG source metadata
        if: github.event.schedule == env.FAR_AIM_REFRESH_SCHEDULE || (github.event_name == 'workflow_dispatch' && inputs.refresh_reference_sources)
        working-directory: scripts
        run: uv run python finalize_reference_refresh.py

      - name: Detect refreshed source changes
        id: changes
        shell: bash
        run: |
          ac_changed=false
          source_changed=false
          if ! git diff --quiet -- data/advisory-circulars/index.json \
            || [[ -s "$RUNNER_TEMP/ac-changed-ids.txt" ]]; then
            ac_changed=true
          fi
          if [[ -n "$(git status --porcelain -- data/far data/aim data/source-status.json \
            web/public/far/images web/public/aim/images)" ]]; then
            source_changed=true
          fi
          if [[ "$ac_changed" == false && "$source_changed" == false ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ac_changed=false" >> "$GITHUB_OUTPUT"
            echo "Official sources are unchanged. No PR created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ac_changed=$ac_changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new or changed AC content
        if: steps.changes.outputs.ac_changed == 'true'
        working-directory: scripts
        shell: bash
        run: |
          mapfile -t changed_ids < "$RUNNER_TEMP/ac-changed-ids.txt"
          args=(--max-workers 2 --timeout 120)
          if (( ${#changed_ids[@]} )); then
            for id in "${changed_ids[@]}"; do
              args+=(--id "$id")
            done
            args+=(--refresh --resolve-pdf-url)
          fi
          uv run --extra ocr python crawl_advisory_circulars.py --ocr "${args[@]}"

      - name: Finalize source metadata and claims
        if: steps.changes.outputs.ac_changed == 'true'
        working-directory: scripts
        run: >-
          uv run python finalize_advisory_circular_refresh.py
          --before-index "$RUNNER_TEMP/ac-index-before.json"
          --summary-json "$RUNNER_TEMP/ac-refresh-summary.json"
          --summary-markdown "$RUNNER_TEMP/ac-refresh-summary.md"

      - name: Summarize FAR, AIM, and PCG refresh
        if: github.event.schedule == env.FAR_AIM_REFRESH_SCHEDULE || (github.event_name == 'workflow_dispatch' && inputs.refresh_reference_sources)
        shell: bash
        run: |
          {
            echo '## FAR, AIM, and PCG sources'
            echo
            echo 'The weekly refresh downloaded eCFR FAR content and FAA AIM and Pilot/Controller Glossary publications. Crawler completeness checks passed.'
          } >> "$RUNNER_TEMP/ac-refresh-summary.md"

      - name: Audit all bundled AC text
        working-directory: scripts
        run: uv run python crawl_advisory_circulars.py --check

      - name: Rebuild search and route artifacts
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/build_inverted_index.js
          node scripts/generate_sitemap.js
          ./scripts/sync-data.sh all

      - name: Validate refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd scripts
          uv run ruff check .
          uv run pytest -q
          uv run python check_source_freshness.py --json
          cd ..
          node scripts/build_inverted_index.js --check
          git diff --check

      - name: Guard generated change scope
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          mapfile -d '' changed_files < <(git status --porcelain=v1 -z | cut -z -c4-)
          unexpected=()
          for path in "${changed_files[@]}"; do
            case "$path" in
              NEXT_STEPS.md | \
              data/source-status.json | \
              data/advisory-circulars/* | \
              data/far/* | \
              data/aim/* | \
              mobile/android/app/src/main/assets/source-status.json | \
              mobile/android/app/src/main/assets/search/inverted-index-ac.json | \
              mobile/android/app/src/main/assets/advisory-circulars/* | \
              mobile/android/app/src/main/assets/far/* | \
              mobile/android/app/src/main/assets/aim/* | \
              mobile/ios/FARAIMPro/Resources/data/source-status.json | \
              mobile/ios/FARAIMPro/Resources/data/search/inverted-index-ac.json | \
              mobile/ios/FARAIMPro/Resources/data/advisory-circulars/* | \
              mobile/ios/FARAIMPro/Resources/data/far/* | \
              mobile/ios/FARAIMPro/Resources/data/aim/* | \
              scripts/capture-android-screenshots.sh | \
              store/android/metadata/en-US/full_description.txt | \
              store/ios/metadata/en-US/description.txt | \
              web/e2e/updates.spec.ts | \
              web/src/data/generated/search-manifest.json | \
              web/public/search/* | \
              web/public/inverted-index-ac.json | \
              web/public/search-metadata-ac.json | \
              web/public/inverted-index-*.json | \
              web/public/search-metadata-*.json | \
              web/public/far/images/* | \
              web/public/aim/images/* | \
              web/public/sitemap.xml)
                ;;
              *)
                unexpected+=("$path")
                ;;
            esac
          done
          if (( ${#unexpected[@]} )); then
            printf 'Unexpected generated path: %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Commit generated refresh
        if: steps.changes.outputs.changed == 'true'
        id: generated_commit
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          {
            echo "chore(data): refresh official aviation references"
            echo
            echo "Generated by $GITHUB_WORKFLOW."
            echo
            echo "Generated-By: $WORKFLOW_FILE"
            echo "Workflow-Name: $GITHUB_WORKFLOW"
            echo "Workflow-Run: $RUN_URL"
            echo "Workflow-Trigger: $GITHUB_EVENT_NAME"
            echo "Generator-Revision: $GITHUB_SHA"
          } > "$RUNNER_TEMP/ac-refresh-commit-message.txt"
          git commit -F "$RUNNER_TEMP/ac-refresh-commit-message.txt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          remote_sha=$(git ls-remote --heads origin "refs/heads/$UPDATE_BRANCH" | cut -f1)
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote_sha" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi

      - name: Dispatch generated-branch validation
        if: steps.changes.outputs.changed == 'true'
        id: validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATED_SHA: ${{ steps.generated_commit.outputs.sha }}
          GENERATOR_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
            const workflows = [
              { workflow_id: 'web-ci.yml', name: 'Web CI' },
              { workflow_id: 'scripts-ci.yml', name: 'Scripts CI' },
              {
                workflow_id: 'android-build.yml',
                name: 'Android Build',
                inputs: { capture_screenshots: 'false' },
              },
              { workflow_id: 'security-ci.yml', name: 'Security CI' },
              { workflow_id: 'source-freshness.yml', name: 'Source Freshness' },
              { workflow_id: 'ios-ci.yml', name: 'iOS CI' },
            ]

            const owner = context.repo.owner
            const repo = context.repo.repo
            const headSha = process.env.GENERATED_SHA
            const checkName = 'Generated Content Refresh Validation'
            let checkRunId
            const results = []

            try {
              const check = await github.rest.checks.create({
                owner,
                repo,
                name: checkName,
                head_sha: headSha,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                details_url: process.env.GENERATOR_RUN_URL,
                output: {
                  title: 'Generated aviation reference validation running',
                  summary: `Generated and tracked by [${context.workflow}](${process.env.GENERATOR_RUN_URL}).`,
                },
              })
              checkRunId = check.data.id

              for (const workflow of workflows) {
                const result = { ...workflow, run: null, conclusion: null }
                results.push(result)
                const request = {
                  owner,
                  repo,
                  workflow_id: workflow.workflow_id,
                  ref: process.env.UPDATE_BRANCH,
                }
                if (workflow.inputs) {
                  request.inputs = workflow.inputs
                }
                try {
                  await github.rest.actions.createWorkflowDispatch(request)
                } catch (error) {
                  result.conclusion = 'dispatch failed'
                  core.error(`${workflow.name} dispatch failed: ${error.message}`)
                }
              }

              const deadline = Date.now() + 60 * 60 * 1000
              while (results.some((result) => !result.conclusion) && Date.now() < deadline) {
                for (const result of results.filter((item) => !item.conclusion)) {
                  if (!result.run) {
                    const response = await github.rest.actions.listWorkflowRuns({
                      owner,
                      repo,
                      workflow_id: result.workflow_id,
                      branch: process.env.UPDATE_BRANCH,
                      event: 'workflow_dispatch',
                      per_page: 20,
                    })
                    result.run = response.data.workflow_runs
                      .filter((run) => run.head_sha === headSha)
                      .sort((left, right) => right.id - left.id)[0] ?? null
                  } else {
                    result.run = (await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: result.run.id,
                    })).data
                  }

                  if (result.run?.status === 'completed') {
                    result.conclusion = result.run.conclusion ?? 'unknown'
                  }
                }

                if (results.some((result) => !result.conclusion)) {
                  await sleep(15000)
                }
              }

              for (const result of results.filter((item) => !item.conclusion)) {
                result.conclusion = 'timed out'
              }

              const failed = results.some((result) => result.conclusion !== 'success')
              const lines = results.map((result) => {
                const label = result.run?.html_url
                  ? `[${result.name}](${result.run.html_url})`
                  : result.name
                return `- ${label}: ${result.conclusion}`
              })
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion: failed ? 'failure' : 'success',
                completed_at: new Date().toISOString(),
                details_url: process.env.GENERATOR_RUN_URL,
                output: {
                  title: failed
                    ? 'Generated aviation reference validation failed'
                    : 'Generated aviation reference validation passed',
                  summary: [
                    `Generated and tracked by [${context.workflow}](${process.env.GENERATOR_RUN_URL}).`,
                    '',
                    ...lines,
                  ].join('\n'),
                },
              })

              core.setOutput('markdown', lines.join('\n'))
              core.setOutput('failed', String(failed))
              core.info(`Generated-branch validation complete:\n${lines.join('\n')}`)
            } catch (error) {
              core.error(`Generated-branch validation failed: ${error.message}`)
              if (checkRunId) {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: checkRunId,
                  status: 'completed',
                  conclusion: 'failure',
                  completed_at: new Date().toISOString(),
                  details_url: process.env.GENERATOR_RUN_URL,
                  output: {
                    title: 'Generated aviation reference validation failed',
                    summary: `Validation orchestration failed in [${context.workflow}](${process.env.GENERATOR_RUN_URL}): ${error.message}`,
                  },
                })
              }
              core.setOutput('markdown', `Validation orchestration failed: ${error.message}`)
              core.setOutput('failed', 'true')
            }

      - name: Build traceable PR body
        if: steps.changes.outputs.changed == 'true'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_RUNS: ${{ steps.validation.outputs.markdown }}
        shell: bash
        run: |
          {
            echo "> [!IMPORTANT]"
            echo "> Generated by **$GITHUB_WORKFLOW** from \`$WORKFLOW_FILE\`."
            echo ">"
            echo "> Workflow run: $RUN_URL"
            echo "> Generator revision: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$WORKFLOW_FILE"
            echo "> Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "> Actor: \`$GITHUB_ACTOR\`"
            echo "> Generated branch: \`$UPDATE_BRANCH\`"
            echo ">"
            echo "> Repair generation logic in \`$WORKFLOW_FILE\` or its referenced scripts. Do not repair generated content only."
            echo
            cat "$RUNNER_TEMP/ac-refresh-summary.md"
            echo "## Validation"
            echo
            echo "- Strict FAA export/list agreement"
            echo "- FAA AC catalog/content and weekly FAR/AIM/PCG crawler validation"
            echo "- Python lint and tests"
            echo "- Search-index consistency"
            echo "- Generated-path scope guard"
            echo "- Generated-commit validation tracked by native \`Generated Content Refresh Validation\` check:"
            printf '%s\n' "$VALIDATION_RUNS"
            echo
            echo "Auto-merge is intentionally disabled. Review source changes and extraction coverage before merging."
          } > "$RUNNER_TEMP/ac-refresh-pr-body.md"

      - name: Open or update generated PR
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_BODY_PATH: ${{ runner.temp }}/ac-refresh-pr-body.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = process.env.UPDATE_BRANCH
            const title = '[automation: FAA source refresh] Update bundled content'
            const body = fs.readFileSync(process.env.PR_BODY_PATH, 'utf8')
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${branch}`,
              per_page: 100,
            })
            let pull
            if (existing.length) {
              pull = (await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing[0].number,
                title,
                body,
              })).data
            } else {
              pull = (await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: 'main',
                title,
                body,
              })).data
            }
            core.setOutput('url', pull.html_url)
            core.setOutput('number', String(pull.number))

      - name: Publish run summary
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          VALIDATION_RUNS: ${{ steps.validation.outputs.markdown }}
        run: |
          {
            cat "$RUNNER_TEMP/ac-refresh-summary.md"
            echo "Generated PR: $PR_URL"
            echo "Generator: \`$WORKFLOW_FILE\`"
            echo "Generated validation:"
            printf '%s\n' "$VALIDATION_RUNS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on generated validation error
        if: steps.changes.outputs.changed == 'true' && steps.validation.outputs.failed == 'true'
        run: |
          echo "Generated-branch validation failed. Review the native check and linked runs." >&2
          exit 1

      - name: Publish failure provenance
        if: failure()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "FAA AC update generation failed."
            echo "Workflow: \`$WORKFLOW_FILE\`"
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
