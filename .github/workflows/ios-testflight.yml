name: iOS TestFlight archive
run-name: iOS TestFlight archive - ${{ inputs.build_number || github.ref_name }}

on:
  push:
    tags:
      - testflight-ios-*
  workflow_dispatch:
    inputs:
      build_number:
        description: Positive numeric CFBundleVersion, not previously uploaded
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-inputs:
    name: Validate release source and build number
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build-number: ${{ steps.number.outputs.build_number }}
    steps:
      - name: Resolve tag or manual build number
        id: number
        shell: bash
        env:
          MANUAL_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) build_number="$MANUAL_BUILD_NUMBER" ;;
            push)
              [[ "$GITHUB_REF" == refs/tags/testflight-ios-* ]] || { echo 'error: a TestFlight release tag is required' >&2; exit 1; }
              build_number="${GITHUB_REF_NAME#testflight-ios-}"
              ;;
            *) echo 'error: unsupported release event' >&2; exit 1 ;;
          esac
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || { echo 'error: build number must be a positive integer' >&2; exit 1; }
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Require successful iPhone, Duo, and iPad tests for this source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_CONFIG_DIR: ${{ runner.temp }}/gh
        run: |
          set -euo pipefail
          run=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ios-ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=completed -f per_page=1)
          jq -e --arg sha "$GITHUB_SHA" '
            .workflow_runs[0] | .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' <<< "$run" >/dev/null || {
            echo "error: the latest completed iOS CI run for $GITHUB_SHA must pass before archiving" >&2
            exit 1
          }
          run_id=$(jq -r '.workflow_runs[0].id' <<< "$run")
          jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion}')
          jq -se '
            (["iOS tests (iPhone 18 Pro)", "iOS tests (iPhone Duo)", "iOS tests (iPad Pro 11-inch (M5))"]
             - [.[] | select(.conclusion == "success") | .name] | length) == 0
          ' <<< "$jobs" >/dev/null || {
            echo 'error: successful iPhone, Duo, and iPad jobs are all required for this source' >&2
            exit 1
          }
          printf 'Validated iPhone, Duo, and iPad: %s\n' "$(jq -r '.workflow_runs[0].html_url' <<< "$run")"

  archive:
    needs: release-inputs
    uses: bvolpato/brutv/.github/workflows/ios-native-archive.yml@1f67eff147f52fd43efbbaad3aaf83d096bc7f34
    with:
      project: mobile/ios/FARAIMPro.xcodeproj
      scheme: FARAIMPro
      build-number: ${{ needs.release-inputs.outputs.build-number }}
      unit-test-target: FARAIMProTests
      ui-test-selectors: FARAIMProUITests/ReaderExperienceTests
      simulator: iPhone 18 Pro
      prepare-command: ./scripts/sync-data.sh ios
